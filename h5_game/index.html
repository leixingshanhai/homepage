<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷行山海的H5小游戏页面</title>
    <link href="css.css" rel="stylesheet" />
</head>
<body>
    <div class="cards-container">
		<div class="card" onClick="cardClick('tetris')">
			<div class="card-image" style="background-color: #3498db;">卡片 1</div>
			<div class="card-content">
				<h3 class="card-title">俄罗斯方块</h3>
				<p class="card-text">这是第一张卡片的内容描述。延迟出现效果让页面加载更有层次感。</p>
			</div>
		</div>
        <div class="card">
            <div class="card-image" style="background-color: #e74c3c;">卡片 2</div>
            <div class="card-content">
                <h3 class="card-title">标题 2</h3>
                <p class="card-text">这是第二张卡片的内容描述。每张卡片都有不同的延迟时间。</p>
            </div>
        </div>
        <div class="card">
            <div class="card-image" style="background-color: #2ecc71;">卡片 3</div>
            <div class="card-content">
                <h3 class="card-title">标题 3</h3>
                <p class="card-text">这是第三张卡片的内容描述。动画效果平滑自然。</p>
            </div>
        </div>
        <div class="card">
            <div class="card-image" style="background-color: #f39c12;">卡片 4</div>
            <div class="card-content">
                <h3 class="card-title">标题 4</h3>
                <p class="card-text">这是第四张卡片的内容描述。响应式设计适应各种屏幕。</p>
            </div>
        </div>
        <div class="card">
            <div class="card-image" style="background-color: #9b59b6;">卡片 5</div>
            <div class="card-content">
                <h3 class="card-title">标题 5</h3>
                <p class="card-text">这是第五张卡片的内容描述。纯CSS实现无需JavaScript。</p>
            </div>
        </div>
        <div class="card">
            <div class="card-image" style="background-color: #1abc9c;">卡片 6</div>
            <div class="card-content">
                <h3 class="card-title">标题 6</h3>
                <p class="card-text">这是第六张卡片的内容描述。可以轻松调整延迟时间。</p>
            </div>
        </div>
        
        <div class="card" style="visibility: hidden;">
        </div>
        
        <div class="card" style="visibility: hidden;">
        </div>
    </div>

    <script src="js.js"></script>
</body>
</html>
